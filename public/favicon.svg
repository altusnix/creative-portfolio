  <!-- Stylized "RS" initials -->
  <text x="32" y="42"
        font-family="Orbitron, monospace"
        font-size="24"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle">RS</text>

  <!-- Accent glow effect -->
  <path d="M32 4 L54 16 L54 40 L32 52 L10 40 L10 16 Z"
        fill="none"
        stroke="#ec4899"
